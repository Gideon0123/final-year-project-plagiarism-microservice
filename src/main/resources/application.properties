spring.application.name=PLAGIARISM-SERVICE

logging.level.org.springframework.security=TRACE

spring.config.import=optional:configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.prefer-ip-address=true

#server.port=8084

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

server.port=8084

eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
spring.cloud.loadbalancer.retry.enabled=true

spring.cloud.gateway.default-filters[1].name=Retry
spring.cloud.gateway.default-filters[1].args.retries=3

#MYSQL CONFIG
spring.datasource.url=jdbc:mysql://localhost:3306/plagiarism_db
spring.datasource.username=root
spring.datasource.password=Hopy247$$$
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org..hibernate.SQL=DEBUG
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect